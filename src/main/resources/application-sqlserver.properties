# ===== Conexão com o SQL Server =====
# Preencha o que for diferente na sua máquina (ou defina as variáveis de ambiente DB_HOST, DB_PORT, DB_USER, DB_PASSWORD).
# Para instância nomeada (ex.: SQLEXPRESS), troque a URL por:
# jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=SABESP;encrypt=true;trustServerCertificate=true;
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=SABESP;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:SenhaTeste123!}

# O banco é criado pelo script SQL, então o Hibernate NÃO deve criar/alterar tabelas.
# validate = só confere se as entidades batem com as tabelas e acusa erro ao iniciar se não baterem.
spring.jpa.hibernate.ddl-auto=validate