# Banco H2 em memória: some quando a aplicação é encerrada.
# "sa" e senha vazia são o padrão do H2 em memória, não são credenciais do seu SQL Server.
spring.datasource.url=jdbc:h2:mem:sabesp;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria as tabelas a partir das entidades (só neste perfil)
spring.jpa.hibernate.ddl-auto=create-drop

# Os dados de exemplo vêm da classe DadosDeTesteDev (perfil dev)
spring.sql.init.mode=never