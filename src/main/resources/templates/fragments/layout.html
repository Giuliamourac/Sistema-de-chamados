<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<!-- ============ HEAD ============ -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Sabesp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- ============ CABEÇALHO ÚNICO (todas as telas) ============ -->
<header class="cab cab--portal" th:fragment="cabecalho-portal">
    <a class="cab__logo" th:href="@{/}" aria-label="SoliCenter - página inicial">
        <img th:src="@{/img/solicenter-logo.png}" alt="SoliCenter">
    </a>
    <nav class="cab__nav" aria-label="Principal">
        <a th:href="@{/}">A Sabesp</a>
        <a th:href="@{/chamados}">Acompanhe sua solicitação</a>
        <a th:href="@{/chamados/novo}">Solicite</a>
        <a href="#">SAQ</a>
    </nav>
    <form class="cab__busca" th:action="@{/chamados/historico}" method="get" role="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" aria-hidden="true">
            <circle cx="10" cy="10" r="7"/>
            <line x1="15.5" y1="15.5" x2="22" y2="22"/>
        </svg>
        <input type="search" name="q" placeholder="Pesquise o que você deseja" aria-label="Pesquisar">
    </form>
    <form class="cab__sessao" th:if="${usuarioLogado != null}" th:action="@{/logout}" method="post">
        <button type="submit" class="btn-login">Sair</button>
    </form>
    <a class="btn-login" th:if="${usuarioLogado == null}" th:href="@{/login}">Login</a>
</header>

<!-- ============ RODAPÉ ============ -->
<footer class="rodape" th:fragment="rodape">
    <img th:src="@{/img/solicenter-logo-rodape.png}" alt="SoliCenter">
</footer>

<!-- ============ CARTÃO DE CHAMADO (Acompanhe / Histórico) ============ -->
<article class="cartao" th:fragment="cartao(c, historico)">
    <div class="cartao__corpo">
        <h2 class="cartao__titulo" th:text="${c.tipoOcorrencia}">Vazamento de água na rua</h2>
        <p class="cartao__endereco" th:text="${c.enderecoCompleto}">Rua Afonso Pena, 584</p>
        <p class="cartao__descricao" th:text="${c.descricao}">Descrição</p>
        <a class="btn-cartao" th:href="@{/chamados/acompanhar/{p}(p=${c.protocolo})}">
            <span th:text="${historico} ? 'Conferir histórico de andamento' : 'Conferir andamento'">Conferir andamento</span>
            <span aria-hidden="true">→</span>
        </a>
    </div>
    <div class="cartao__lateral">
        <span class="selo" th:classappend="'selo--' + ${c.statusClasse}" th:text="${c.statusRotulo}">Em andamento</span>
        <div class="tempo" th:if="${historico}">
            <strong>Tempo em aberto</strong>
            <span th:text="${c.tempoEmAberto}">4 dias e 7 horas</span>
        </div>
    </div>
</article>

</body>
</html>
