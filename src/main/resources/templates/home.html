<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sabesp | Solicite por aqui')}"></head>
<body class="tema-portal">

<header th:replace="~{fragments/layout :: cabecalho-portal}"></header>

<main class="home">
    <!-- Elipses decorativas (ficam atrás da foto) -->
    <img class="home__elipses home__elipses--esq" th:src="@{/img/home-elipses-esquerda.svg}" alt="">
    <img class="home__elipses home__elipses--dir" th:src="@{/img/home-elipses-direita.svg}" alt="">

    <!-- Borda ondulada da foto (mesma curva do Figma, em proporção) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <clipPath id="onda-hero" clipPathUnits="objectBoundingBox">
            <path d="M0 0H1V0.94888C1 0.94888 0.890292 0.980164 0.819792 0.990798C0.55017 1.031466 0.354167 0.915133 0.129514 0.879346C-0.095139 0.843558 0 0.94888 0 0.94888V0Z"/>
        </clipPath>
    </svg>

    <div class="home__hero">
        <img th:src="@{/img/home-foto.svg}" alt="Equipe da Sabesp fazendo reparo na rede de água">
    </div>

    <div class="home__conteudo">
        <h1 class="home__titulo">Solicite por aqui!</h1>
        <p class="home__texto home__texto--grande">
            Faça solicitações de reparo em poucos passos, acompanhe cada atualização e tenha mais controle
            sobre suas demandas. Simples para solicitar, fácil para acompanhar.
        </p>
        <a class="btn-home" th:href="@{/chamados/novo}">Fazer solicitação</a>

        <h2 class="home__titulo home__titulo--segundo">Já fez uma solicitação?</h2>
        <p class="home__texto">Consulte as solicitações ja feitas por você!</p>
        <a class="btn-home" th:href="@{/chamados}">Consultar solicitação</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>

</body>
</html>
